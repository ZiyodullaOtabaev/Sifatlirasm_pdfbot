version: "3.9"

services:
  bot:
    build: .
    container_name: rasm_pdf_bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/app/downloads
      - ./bot.db:/app/bot.db
    environment:
      - PYTHONUNBUFFERED=1